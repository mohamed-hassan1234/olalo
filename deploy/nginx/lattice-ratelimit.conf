# Shared rate-limit zone for the Lattice API (used by zdu.elivateict.com.conf and zakariye.elivateict.com.conf).
# Install: sudo cp deploy/nginx/lattice-ratelimit.conf /etc/nginx/conf.d/lattice-ratelimit.conf
# Declared once here so that several site files can use it without a "duplicate zone" error.
limit_req_zone $binary_remote_addr zone=lattice_api:10m rate=20r/s;

# nginx site for the OLD hostname https://zakariye.elivateict.com  (retired; redirects to https://zdu.elivateict.com)
#
#   pages, assets, /console/  -> 301 to the same path on https://zdu.elivateict.com
#   /v1/, /admin/v1/          -> still proxied to the API (NOT redirected), so pages cached under the old
#                                hostname keep working; the API's own CORS/CSRF origin checks still apply.
#
# Requires: /etc/nginx/conf.d/lattice-ratelimit.conf (zone "lattice_api") and the existing Let's Encrypt
# certificate for zakariye.elivateict.com (certbot keeps renewing it only while the DNS record for
# zakariye.elivateict.com points at this server).
# Install (phase 2 of docs/DOMAIN_MIGRATION.md, only after https://zdu.elivateict.com is verified):
#          sudo cp this file /etc/nginx/sites-available/zakariye.elivateict.com.conf && sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name zakariye.elivateict.com;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zakariye.elivateict.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/zakariye.elivateict.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zakariye.elivateict.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # ---- API: keep serving (do not redirect API calls) --------------------------------------
    location /v1/ {
        limit_req zone=lattice_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /admin/v1/ {
        limit_req zone=lattice_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Everything else: permanent redirect to the primary domain, same path + query --------
    location / {
        return 301 https://zdu.elivateict.com$request_uri;
    }
}

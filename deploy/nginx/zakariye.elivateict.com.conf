# nginx site TEMPLATE for the OLD hostname https://zakariye.elivateict.com (retired; redirects to https://zdu.elivateict.com).
# Installed only by `deploy/migrate-domain.sh phase2`, after the new domain is verified. The script renders:
#   __API_PORT__  PORT from /etc/lattice/api.env        __ZONE__  lattice_zdu (declared in the zdu.elivateict.com site file)
#   __OLD_CERT__ / __OLD_KEY__  the certificate paths already used by the live old site    __LE_DIR__  /etc/letsencrypt
# Lines ending in "# ipv6" are dropped when the existing site does not listen on IPv6.
#
#   pages, assets, /console/  -> 301 to the same path + query on https://zdu.elivateict.com
#   /v1/, /admin/v1/          -> still proxied to the API (NOT redirected), so pages cached under the old
#                                hostname keep working; the API's own CORS/CSRF origin checks still apply.
# certbot can renew the old certificate only while DNS for zakariye.elivateict.com points at this server.

server {
    listen 80;
    listen [::]:80; # ipv6
    server_name zakariye.elivateict.com;
    server_tokens off;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl; # ipv6
    server_name zakariye.elivateict.com;
    server_tokens off;

    ssl_certificate __OLD_CERT__;
    ssl_certificate_key __OLD_KEY__;
    include __LE_DIR__/options-ssl-nginx.conf;
    ssl_dhparam __LE_DIR__/ssl-dhparams.pem;

    client_max_body_size 1m;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # ---- API: keep serving (do not redirect API calls) --------------------------------------
    location /v1/ {
        limit_req zone=__ZONE__ burst=40 nodelay;
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /admin/v1/ {
        limit_req zone=__ZONE__ burst=40 nodelay;
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Everything else: permanent redirect to the primary domain, same path + query --------
    location / {
        return 301 https://zdu.elivateict.com$request_uri;
    }
}

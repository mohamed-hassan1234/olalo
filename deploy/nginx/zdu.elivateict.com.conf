# nginx site TEMPLATE for https://zdu.elivateict.com (primary domain).
# Do not copy this file to the server as is: deploy/migrate-domain.sh renders it (`render` prints the result),
# filling in the values it verifies on the server:
#   __API_PORT__   PORT from /etc/lattice/api.env (checked against the live vhost and the listening socket)
#   __WEB_ROOT__   /var/www/zakariye/apps/web/out        __ADMIN_ROOT__  /var/www/zakariye/apps/admin/dist
#   __ACME_ROOT__  certbot --webroot directory            __LE_DIR__      /etc/letsencrypt
#   __SSL_CERT__ / __SSL_KEY__  the Let's Encrypt certificate for zdu.elivateict.com
#   __ZONE__       this site's own rate-limit zone (lattice_zdu), so no other file has to change
# Lines ending in "# ipv6" are dropped when the existing site does not listen on IPv6.
# Routes: /  static site | /console/  admin app | /v1/, /admin/v1/  API on 127.0.0.1:__API_PORT__

limit_req_zone $binary_remote_addr zone=__ZONE__:10m rate=20r/s;

# BEGIN-HTTP
server {
    listen 80;
    listen [::]:80; # ipv6
    server_name zdu.elivateict.com;
    server_tokens off;

    # Let's Encrypt HTTP-01 challenges (certbot --webroot); nothing else is served over plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root __ACME_ROOT__;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
# END-HTTP

server {
    listen 443 ssl;
    listen [::]:443 ssl; # ipv6
    server_name zdu.elivateict.com;

    ssl_certificate __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;
    include __LE_DIR__/options-ssl-nginx.conf;
    ssl_dhparam __LE_DIR__/ssl-dhparams.pem;

    root __WEB_ROOT__;
    index index.html;
    charset utf-8;
    client_max_body_size 1m;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Security headers ('unsafe-inline' scripts are required by the static Next.js bootstrap; no user HTML is rendered).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Preview build: keep out of search engines until launch approval (docs/LAUNCH.md).
    add_header X-Robots-Tag "noindex, nofollow" always;

    # ---- API (public + admin) -------------------------------------------------------------
    location /v1/ {
        limit_req zone=__ZONE__ burst=40 nodelay;
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /admin/v1/ {
        limit_req zone=__ZONE__ burst=40 nodelay;
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Admin app ------------------------------------------------------------------------
    location /console/ {
        alias __ADMIN_ROOT__/;
        try_files $uri $uri/ /console/index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }

    # ---- Public site ----------------------------------------------------------------------
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
    error_page 404 /404.html;
}

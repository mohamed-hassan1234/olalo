# nginx site for https://zdu.elivateict.com  (primary domain)
#   /            -> public site (static Next.js export)   /var/www/zakariye/apps/web/out
#   /console/    -> admin app (static Vite build)          /var/www/zakariye/apps/admin/dist
#   /v1/, /admin/v1/ -> Express API on 127.0.0.1:4100
# Install: sudo cp deploy/nginx/lattice-ratelimit.conf /etc/nginx/conf.d/   (defines zone "lattice_api")
#          sudo cp this file /etc/nginx/sites-available/zdu.elivateict.com.conf
#          sudo ln -s /etc/nginx/sites-available/zdu.elivateict.com.conf /etc/nginx/sites-enabled/
#          sudo certbot --nginx -d zdu.elivateict.com --redirect   (adds the HTTPS server block and redirect)
# The old hostname is handled by zakariye.elivateict.com.conf (redirects here).

server {
    listen 80;
    listen [::]:80;
    server_name zdu.elivateict.com;

    root /var/www/zakariye/apps/web/out;
    index index.html;
    charset utf-8;
    client_max_body_size 1m;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Security headers ('unsafe-inline' scripts are required by the static Next.js bootstrap; no user HTML is rendered).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Preview build: keep out of search engines until launch approval (docs/LAUNCH.md).
    add_header X-Robots-Tag "noindex, nofollow" always;

    # ---- API (public + admin) -------------------------------------------------------------
    location /v1/ {
        limit_req zone=lattice_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /admin/v1/ {
        limit_req zone=lattice_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Admin app ------------------------------------------------------------------------
    location /console/ {
        alias /var/www/zakariye/apps/admin/dist/;
        try_files $uri $uri/ /console/index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }

    # ---- Public site ----------------------------------------------------------------------
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
    error_page 404 /404.html;
}
